[project]
name = "kairo-core"
version = "0.1.0"
description = "Deterministic recruiting-mail pipeline for Kairo: prefilter, extraction checks, matching, status transitions"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.12",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairo_core"]
