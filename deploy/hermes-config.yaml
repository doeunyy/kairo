# Hermes config for the Cloud Run container (copied to $HERMES_HOME/config.yaml on every start,
# so the deployed image, not a restored snapshot, decides configuration).
model:
  provider: openai-codex
  default: gpt-5.6-sol
  # HERMES_CODEX_BASE_URL=http://127.0.0.1:8787 sends every call through the Kairo router.
  base_url: https://chatgpt.com/backend-api/codex

auth:
  adopt_external_logins: false

timezone: America/Los_Angeles

auxiliary:
  background_review:
    enabled: false

memory:
  nudge_interval: 0

agent:
  # Untrusted email and web text reach the model, so it gets no shell, files, code execution,
  # browser or raw Discord actions, and cannot read kairo.env, auth.json or the approval key.
  disabled_toolsets: [terminal, file, code_execution, browser, computer_use, delegation, discord,
                      discord_admin, image_gen, video_gen, tts, vision, homeassistant, spotify,
                      kanban, connections, x_search]

skills:
  creation_nudge_interval: 0
  external_dirs: [/app/hermes/skills]

mcp_servers:
  kairo:
    command: /app/core/.venv/bin/python
    args: ["-m", "kairo_core.mcp_server"]
    cwd: /app/core
    env:
      KAIRO_STATE_DIR: /home/agent/state
      KAIRO_ENV_FILE: /secrets/env/kairo.env
    timeout: 60
    connect_timeout: 120

display:
  tool_progress: all

# 1 vCPU: imports are slow at start-up, so give platform plugins (Discord) time to register.
plugins:
  load_timeout_seconds: 90

gateway:
  platforms:
    discord:
      # Kairo restarts on purpose every 3 hours; the supervisor logs each restart, so the
      # per-restart "Hermes is shutting down" notice would only be noise (often at night).
      gateway_restart_notification: false
