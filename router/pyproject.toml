[project]
name = "a3-router"
version = "0.1.0"
description = "Task-aware hybrid LLM router between Hermes (Codex OAuth) and local Gemma 4 on Ollama"
requires-python = ">=3.11,<3.15"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "httpx[socks]>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["a3_router"]
